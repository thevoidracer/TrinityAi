<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trinity Knowledge Library</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --text:#e8e8e8; --muted:#8a8f98; --accent:#4f8cff; --border:#2a2d35; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 16px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  a.topic { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  a.topic:hover { border-color: var(--accent); }
  .topic h2 { font-size: 16px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .topic h2 .arrow { color: var(--muted); font-size: 14px; }
  .topic .desc { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .topic .count { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .allbar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  a.dl { color: var(--accent); text-decoration: none; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
  a.dl:hover { border-color: var(--accent); }
  .loading, .error { color: var(--muted); text-align: center; padding: 40px 0; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 32px 0 12px; }
  .done-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; }
  .done-card h3 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .done-card .links { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trinity Knowledge Library</h1>
  <p class="sub">Unlisted page. Click a topic to read what Trinity has researched.</p>

  <div id="topics" class="loading">Loading topics...</div>
  <div id="completedWrap"></div>
</div>

<script>
const BASE = "https://dbtvgwujxeszcrrldjkr.supabase.co/functions/v1/library";

async function load() {
  const el = document.getElementById('topics');
  try {
    const resp = await fetch(BASE);
    const data = await resp.json();
    if (!data.topics || !data.topics.length) {
      el.className = 'error';
      el.textContent = 'No topics yet.';
      return;
    }
    el.className = '';
    el.innerHTML = data.topics.map(t => {
      const pct = Math.min(100, Math.round((t.fact_count / t.target_count) * 100));
      return `
        <a class="topic" href="/topic_${encodeURIComponent(t.slug)}">
          <h2>${t.label} <span class="arrow">view →</span></h2>
          <p class="desc">${t.description || ''}</p>
          <div class="count">${t.fact_count} / ${t.target_count} facts</div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        </a>`;
    }).join('');
  } catch (e) {
    el.className = 'error';
    el.textContent = 'Failed to load: ' + e.message;
  }
}

// Topics that hit their target get auto-archived (raw/skill/jsonl) the
// moment they complete -- this lists those stable, ready-for-fine-tuning
// snapshots separately from the live, still-growing topics above.
async function loadCompleted() {
  const wrap = document.getElementById('completedWrap');
  try {
    const resp = await fetch(`${BASE}?completed=true`);
    const data = await resp.json();
    const items = data.completed || [];
    if (!items.length) return; // nothing finished yet, say nothing
    wrap.innerHTML = `<div class="section-title">Ready for training (archived)</div>` +
      items.map(c => `
        <div class="done-card">
          <h3>✓ ${c.topic.label} — ${c.fact_count_at_export} facts</h3>
          <div class="links">
            <a class="dl" href="${c.raw_md_url}">⬇ Raw .md</a>
            <a class="dl" href="${c.skill_md_url}">⬇ Skill .md</a>
            <a class="dl" href="${c.jsonl_url}">⬇ Training .jsonl</a>
          </div>
        </div>`).join('');
  } catch (e) {
    console.warn('Failed to load completed datasets:', e);
  }
}

load();
loadCompleted();
</script>
</body>
</html>
