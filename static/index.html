<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinity AI</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --text: #e8e8e8; --muted: #8a8f98;
    --accent: #4f8cff; --bubble-user: #2a3a5c; --bubble-bot: #22252c;
    --border: #2a2d35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }
  #inputRow { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #inputRow textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; max-height: 140px;
  }
  #inputRow button {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  #inputRow button:disabled { opacity: 0.5; cursor: default; }
  #setup {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; padding: 16px;
  }
  #setup.hidden { display: none; }
  #setupBox {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; max-width: 360px; width: 100%;
  }
  #setupBox h2 { margin: 0 0 8px; font-size: 16px; }
  #setupBox p { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  #setupBox input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; margin-bottom: 10px;
  }
  #setupBox button {
    width: 100%; background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Trinity AI</h1>
  <button id="settingsBtn">Settings</button>
</header>

<div id="messages"></div>

<div id="inputRow">
  <textarea id="input" rows="1" placeholder="Message Trinity..."></textarea>
  <button id="sendBtn">Send</button>
</div>

<div id="setup">
  <div id="setupBox">
    <h2>Connect to your gateway</h2>
    <p>This page talks to the Trinity AI gateway running on this same server. Enter the gateway API key from your <code>.env</code> file (GATEWAY_API_KEY). It's stored only in this browser.</p>
    <input id="keyInput" type="password" placeholder="Gateway API key">
    <button id="saveKeyBtn">Save & Start Chatting</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const setupEl = document.getElementById('setup');
const keyInput = document.getElementById('keyInput');

let apiKey = null;
try { apiKey = localStorage.getItem('trinity_api_key'); } catch (e) {}

let history = [];

function showSetup() { setupEl.classList.remove('hidden'); }
function hideSetup() { setupEl.classList.add('hidden'); }

if (apiKey) { hideSetup(); } else { showSetup(); }

document.getElementById('settingsBtn').onclick = () => {
  keyInput.value = apiKey || '';
  showSetup();
};

document.getElementById('saveKeyBtn').onclick = () => {
  const v = keyInput.value.trim();
  if (!v) return;
  apiKey = v;
  try { localStorage.setItem('trinity_api_key', v); } catch (e) {}
  hideSetup();
};

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || !apiKey) return;

  addBubble('user', text);
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  sendBtn.disabled = true;

  const thinking = addBubble('bot', 'Thinking...');

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
      },
      body: JSON.stringify({ messages: history }),
    });

    if (resp.status === 401) {
      thinking.remove();
      addBubble('system', 'Invalid API key. Click Settings to fix it.');
      showSetup();
      return;
    }

    if (!resp.ok) {
      const body = await resp.text();
      thinking.remove();
      addBubble('system', 'Error: ' + body);
      return;
    }

    const data = await resp.json();
    const reply = data.choices[0].message.content;
    thinking.textContent = reply;
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    thinking.remove();
    addBubble('system', 'Network error: ' + e.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
</script>

</body>
</html>
