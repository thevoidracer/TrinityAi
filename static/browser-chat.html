<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinity AI (in-browser)</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --text: #e8e8e8; --muted: #8a8f98;
    --accent: #4f8cff; --bubble-user: #2a3a5c; --bubble-bot: #22252c; --border: #2a2d35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  #status {
    padding: 10px 16px; font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  #progressBar {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 6px;
  }
  #progressFill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }
  #inputRow { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #inputRow textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; max-height: 140px;
  }
  #inputRow button {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  #inputRow button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>Trinity AI</h1>
  <p>Runs entirely in your browser. First load downloads the model (~1GB) and caches it — later visits start instantly.</p>
</header>

<div id="status">Starting up...
  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<div id="messages"></div>

<div id="inputRow">
  <textarea id="input" rows="1" placeholder="Message Trinity..." disabled></textarea>
  <button id="sendBtn" disabled>Send</button>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const MODEL_ID = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";

const statusEl = document.getElementById('status');
const progressFill = document.getElementById('progressFill');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let engine = null;
let history = [
  { role: "system", content: "You are Trinity, a helpful assistant running directly in the user's browser." }
];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function init() {
  if (!("gpu" in navigator)) {
    statusEl.textContent = "Your browser doesn't support WebGPU, which this needs. Try a recent Chrome on desktop or Android.";
    return;
  }

  try {
    engine = new webllm.MLCEngine();
    engine.setInitProgressCallback((report) => {
      statusEl.firstChild.textContent = report.text;
      const pct = Math.round((report.progress || 0) * 100);
      progressFill.style.width = pct + "%";
    });

    await engine.reload(MODEL_ID);

    statusEl.textContent = "Ready.";
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  } catch (e) {
    statusEl.textContent = "Failed to load model: " + e.message;
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || !engine) return;

  addBubble('user', text);
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  sendBtn.disabled = true;

  const bubble = addBubble('bot', '');
  try {
    const stream = await engine.chat.completions.create({
      messages: history,
      stream: true,
    });

    let full = "";
    for await (const chunk of stream) {
      const delta = chunk.choices[0]?.delta?.content || "";
      full += delta;
      bubble.textContent = full;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    history.push({ role: 'assistant', content: full });
  } catch (e) {
    bubble.textContent = "Error: " + e.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

init();
</script>

</body>
</html>
